# ============================================================
# PaddleOCR-VL × NVIDIA GPU (cuda / amd64) — 官方产线 + VLM 双容器
# ------------------------------------------------------------
# 默认拉官方预置镜像（image: 指向 registry）。自建镜像用 compose build：
#   docker compose -f docker/paddleocr-cuda-amd64/compose.yml build
# （build 复用各服务 image: tag；up 优先用本地构建结果）
#
# 三点改造（相对官方）：
#   1. VLM 服务 command: 显式 --port 8118（官方镜像默认 8080，与产线 :8080 冲突）
#   2. 产线服务 command: --pipeline 指向挂载的 config/pipeline_config_${VLM_BACKEND}.yaml
#   3. volumes: ./config:/home/paddleocr/config:ro（config 中 server_url 指向 :8118）
#
# 用法：
#   仅 GPU OCR：    docker compose -f docker/paddleocr-cuda-amd64/compose.yml up -d
#   CPU + GPU 同机：docker compose -f docker/docker-compose.yml -f docker/paddleocr-cuda-amd64/compose.yml up -d
# 跨机：CPU 机设 PADDLEOCRVL_ADDRESS=http://<gpu-ip>:8080 后起 docker/docker-compose.yml
# 离线部署：先在联网机 docker compose build/pull，导出镜像传至离线机导入。
# ============================================================
services:
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
    build:
      context: .
      dockerfile: pipeline.Dockerfile
      args:
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vl-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
    volumes:
      - ./config:/home/paddleocr/config:ro
    # 用挂载的 config（server_url 指向 VLM :8118），覆盖镜像内置默认
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/config/pipeline_config_${VLM_BACKEND}.yaml"
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${VLM_BACKEND:-vllm}-server:${VLM_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-offline}
    build:
      context: .
      dockerfile: vlm.Dockerfile
      args:
        BACKEND: "${VLM_BACKEND:-vllm}"
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vlm-server
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    # 显式指定 8118 端口（镜像 CMD 默认 8080），与产线 :8080 解耦
    command: >
      paddleocr genai_server
      --model_name ${VLM_MODEL_NAME:-PaddleOCR-VL-1.6-0.9B}
      --host 0.0.0.0
      --port 8118
      --backend ${VLM_BACKEND:-vllm}
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8118/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

networks:
  ocr-net:
    driver: bridge
    name: ocr-net
