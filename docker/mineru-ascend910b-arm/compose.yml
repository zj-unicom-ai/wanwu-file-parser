# ============================================================
# MinerU × 华为昇腾 910B (Ascend NPU / arm64) — MinerU API 服务（仅 API）
# ------------------------------------------------------------
# MinerU 仅保留 API client（models/mineru/client.py），本 compose 只起 MinerU 推理 API 服务。
# doc-parser-server 由 docker/docker-compose.yml 提供。
#
# 改造（与 paddleocr 组合对齐）：
#   1. command: 显式 mineru-api --host 0.0.0.0 --port 8000
#   2. volumes: 持久化 MinerU 模型缓存与解析输出
#   3. 昇腾 NPU 设备 + 驱动透传（privileged + davinci 设备 + Ascend 驱动只读挂载）
#
# 用法：
#   仅 MinerU API：  docker compose -f docker/mineru-ascend910b-arm/compose.yml up -d
#   CPU + MinerU 同机：docker compose -f docker/docker-compose.yml -f docker/mineru-ascend910b-arm/compose.yml up -d
# 跨机：CPU 机设 MINERU_API_ADDRESS=http://<mineru-ip>:8000 后起 docker/docker-compose.yml
# 前置：宿主机已安装昇腾驱动+固件（/usr/local/Ascend/driver）。
# ============================================================
services:
  mineru-api:
    image: ${MINERU_IMAGE:-crpi-6pj79y7ddzdpexs8.cn-hangzhou.personal.cr.aliyuncs.com/wanwulite/doc_parser_server:1.4.0-20260716-arm64-mineru-npu}
    container_name: mineru-api
    restart: unless-stopped
    shm_size: 32g
    ipc: host
    privileged: true
    ports:
      - "${MINERU_API_PORT:-8000}:8000"
    command: mineru-api --host 0.0.0.0 --port 8000
    # 昇腾 NPU 设备 + 驱动透传（参考 paddleocr-ascend910b-arm）
    devices:
      - /dev/davinci0
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
      - mineru-models:/root/.cache
      - mineru-output:/tmp/mineru
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s

networks:
  ocr-net:
    driver: bridge
    name: ocr-net

volumes:
  mineru-models:
  mineru-output:
