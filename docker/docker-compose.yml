# Default: CPU dispatch service only (:8083). No GPU/OCR.
# To run OCR, overlay a hardware-specific compose, e.g.:
#   docker compose -f docker/docker-compose.yml -f docker/paddleocr-cuda-amd64/compose.yml up -d
services:
  doc-parser-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: wanwu-file-parser:cpu
    container_name: wanwu-file-parser
    ports:
      - "${APP_PORT:-8083}:8083"
    env_file:
      - ../.env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8083
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/rag/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
