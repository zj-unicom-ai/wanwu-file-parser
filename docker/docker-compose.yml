# ============================================================
# Default Compose — CPU dispatch service only (:8083)
# ------------------------------------------------------------
# - No OCR inference (no GPU/NPU); OCR is provided by separate GPU/NPU compose
# - Image tag uses version number (FILE_PARSER_IMAGE_TAG, default 0.1.0)
# - Data/logs use named volumes, no host directory coupling
# - command explicitly overrides Dockerfile CMD (uvicorn launches FastAPI app)
#
# Run CPU + OCR on the same machine: overlay a hardware-specific compose:
#     docker compose -f docker/docker-compose.yml -f docker/paddleocr-cuda-amd64/compose.yml up -d
# Cross-machine: set PADDLEOCRVL_ADDRESS=http://<gpu-ip>:8080 pointing to remote GPU
# ============================================================
services:
  file-parser:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: wanwu-file-parser:${FILE_PARSER_IMAGE_TAG:-0.1.0}
    container_name: wanwu-file-parser
    restart: unless-stopped
    ports:
      - "${FILE_PARSER_PUBLIC_PORT:-8083}:${APP_PORT:-8083}"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=${APP_PORT:-8083}
      - MODEL_TYPE=${MODEL_TYPE:-paddleocrvl}
      - OFFICE_PROCESSING_MODE=${OFFICE_PROCESSING_MODE:-auto}
      - OCR_BASE_URL=${OCR_BASE_URL:-}
      - MINERU_API_PATH=${MINERU_API_PATH:-file_parse}
      - PADDLEOCRVL_API_LAYOUT_PARSING_PATH=${PADDLEOCRVL_API_LAYOUT_PARSING_PATH:-layout-parsing}
      - PADDLEOCRVL_API_RESTRUCTURE_PAGES_PATH=${PADDLEOCRVL_API_RESTRUCTURE_PAGES_PATH:-restructure-pages}
      - PADDLEOCRVL_ADDRESS=${PADDLEOCRVL_ADDRESS:-http://localhost:8080}
      - MINERU_API_ADDRESS=${MINERU_API_ADDRESS:-http://localhost:8003/file_parse}
      - PREFIX_IMAGE_URL=${PREFIX_IMAGE_URL:-}
      - OSS_TYPE=${OSS_TYPE:-minio}
      - MINIO_ADDRESS=${MINIO_ADDRESS:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-rag-public}
      - MINIO_DOWNLOAD_URL=${MINIO_DOWNLOAD_URL:-http://localhost:8081/minio/download/api}
      - version=${version:-private}
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port ${APP_PORT:-8083}
      --workers ${APP_WORKERS:-1}
    volumes:
      - wanwu-file-parser-data:/app/data
      - wanwu-file-parser-logs:/app/logs
    networks:
      - wanwu-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT:-8083}/rag/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  wanwu-net:
    external: true
    name: wanwu-net

volumes:
  wanwu-file-parser-data:
  wanwu-file-parser-logs:
