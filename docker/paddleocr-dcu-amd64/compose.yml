# ============================================================
# PaddleOCR-VL × 海光 DCU (amd64) — 官方产线 + VLM 双容器
# ------------------------------------------------------------
# 基于官方 PaddleOCR accelerators/hygon-dcu 镜像；设备 /dev/kfd、/dev/dri、/dev/mkfd + /opt/hyhal 只读挂载 + 特权。
# 产线 command 追加 --device dcu。
#
# 用法：
#   docker compose -f docker/paddleocr-dcu-amd64/compose.yml up -d
#   CPU + DCU 同机：docker compose -f docker/docker-compose.yml -f docker/paddleocr-dcu-amd64/compose.yml up -d
# 跨机：CPU 机设 PADDLEOCRVL_ADDRESS=http://<dcu-ip>:8080 后起 docker/docker-compose.yml
# 前置：宿主机已安装海光 DCU 驱动（/opt/hyhal）。
# ============================================================
services:
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX:-latest-hygon-dcu-offline}
    build:
      context: .
      dockerfile: pipeline.Dockerfile
      args:
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vl-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    privileged: true
    devices:
      - /dev/kfd
      - /dev/dri
      - /dev/mkfd
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - /opt/hyhal/:/opt/hyhal/:ro
      - ./config:/home/paddleocr/config:ro
    shm_size: 64g
    user: root
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
    # 海光 DCU 需显式 --device dcu
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/config/pipeline_config_${VLM_BACKEND}.yaml --device dcu"
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${VLM_BACKEND:-vllm}-server:${VLM_IMAGE_TAG_SUFFIX:-latest-hygon-dcu-offline}
    build:
      context: .
      dockerfile: vlm.Dockerfile
      args:
        BACKEND: "${VLM_BACKEND:-vllm}"
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vlm-server
    restart: unless-stopped
    privileged: true
    # 设备映射：海光 DCU 通过 /dev/kfd（调度节点，全卡共用）+ /dev/dri（每卡渲染节点）+ /dev/mkfd（DCU 私有节点）访问。
    #   - /dev/kfd、/dev/dri、/dev/mkfd：必须带（驱动暴露的设备节点，固定路径，不含卡 id）。
    #   - 选第几张卡：设备节点不区分卡 id，靠环境变量 HIP_VISIBLE_DEVICES=N（0 起）在 ROCm/DCU 层选卡；
    #     不设则默认用所有卡。多卡时在 environment: 加 HIP_VISIBLE_DEVICES: "0" 指定单卡。
    #   - 查看宿主机实际设备节点：ls /dev/kfd /dev/dri/renderD* /dev/mkfd（确认驱动已装、节点存在）。
    #   - privileged、group_add: video、SYS_PTRACE、seccomp=unconfined：必须（kfd/dri/mkfd 访问权限）。
    devices:
      - /dev/kfd
      - /dev/dri
      - /dev/mkfd
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - /opt/hyhal/:/opt/hyhal/:ro
      - ./config/vllm_config.yaml:/home/paddleocr/vllm_config.yaml:ro
    shm_size: 64g
    user: root
    command: >
      paddleocr genai_server
      --model_name ${VLM_MODEL_NAME:-PaddleOCR-VL-1.6-0.9B}
      --host 0.0.0.0
      --port 8118
      --backend ${VLM_BACKEND:-vllm}
      --backend_config /home/paddleocr/vllm_config.yaml
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8118/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

networks:
  ocr-net:
    driver: bridge
    name: ocr-net
