# vllm 推理后端配置（由 paddleocr-vlm-server 挂载，--backend_config 指向此文件）。
# 注意 served-model-name 只能单值：
#   - 逗号分隔 "A,B"  → vllm 当成单个字面量名 "A,B"（产线调用 404）
#   - YAML 列表 [A,B] → paddleocr genai_server 转成 Python repr 字符串当单名（更糟）
# 底层加载哪个模型由 compose 的 --model_name 控制；此处仅是 vllm 对外暴露的 API 模型名，
# 须与 pipeline_config_vllm.yaml 的 model_name 一致。
gpu-memory-utilization: 0.2
max-num-seqs: 128
served-model-name: PaddleOCR-VL-1.6-0.9B
