# ============================================================
# PaddleOCR-VL × NVIDIA GPU sm120 (Blackwell / amd64) — 官方产线 + VLM 双容器
# ------------------------------------------------------------
# 基于官方 PaddleOCR accelerators/nvidia-gpu-sm120 镜像；专用于 SM120 (Blackwell) 架构；其余改造同 cuda-amd64。
#
# 用法：
#   docker compose -f docker/paddleocr-cuda-sm120-amd64/compose.yml up -d
#   CPU + GPU 同机：docker compose -f docker/docker-compose.yml -f docker/paddleocr-cuda-sm120-amd64/compose.yml up -d
# 跨机：CPU 机设 PADDLEOCRVL_ADDRESS=http://<gpu-ip>:8080 后起 docker/docker-compose.yml
# ============================================================
services:
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-sm120-offline}
    build:
      context: .
      dockerfile: pipeline.Dockerfile
      args:
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vl-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
    volumes:
      - ./config:/home/paddleocr/config:ro
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/config/pipeline_config_${VLM_BACKEND}.yaml"
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${VLM_BACKEND:-vllm}-server:${VLM_IMAGE_TAG_SUFFIX:-latest-nvidia-gpu-sm120-offline}
    build:
      context: .
      dockerfile: vlm.Dockerfile
      args:
        BACKEND: "${VLM_BACKEND:-vllm}"
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vlm-server
    restart: unless-stopped
    # 设备映射：NVIDIA GPU（Blackwell SM120）通过 deploy.resources.devices 的 device_ids 直接指定卡（compose 层选卡，非环境变量）。
    #   - driver: nvidia + capabilities: [gpu]：必须带（NVIDIA 容器运行时）。
    #   - device_ids: ["${GPU_DEVICE_ID:-0}"]：选第几张卡，0 起的物理卡索引；多卡改 ["0","1"] 或指定单卡 ["0"]。
    #     这是唯一在 compose 层硬选卡的方式（其余厂商靠环境变量）。由 .env 的 GPU_DEVICE_ID 控制。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    # 挂载 vllm_config（vllm 后端 served-model-name 等；与远程手搭版对齐）
    volumes:
      - ./config/vllm_config.yaml:/home/paddleocr/vllm_config.yaml:ro
    command: >
      paddleocr genai_server
      --model_name ${VLM_MODEL_NAME:-PaddleOCR-VL-1.6-0.9B}
      --host 0.0.0.0
      --port 8118
      --backend ${VLM_BACKEND:-vllm}
      --backend_config /home/paddleocr/vllm_config.yaml
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8118/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

networks:
  ocr-net:
    driver: bridge
    name: ocr-net
