# ============================================================
# PaddleOCR-VL × 华为昇腾 910B (Ascend NPU / arm64) — 官方产线 + VLM 双容器
# ------------------------------------------------------------
# 基于官方 PaddleOCR accelerators/huawei-npu 镜像；昇腾驱动只读挂载 + 特权；产线 command 追加 --device npu。
#
# 用法：
#   仅 NPU OCR：    docker compose -f docker/paddleocr-ascend910b-arm/compose.yml up -d
#   CPU + NPU 同机：docker compose -f docker/docker-compose.yml -f docker/paddleocr-ascend910b-arm/compose.yml up -d
# 跨机：CPU 机设 PADDLEOCRVL_ADDRESS=http://<npu-ip>:8080 后起 docker/docker-compose.yml
# 前置：宿主机已安装昇腾驱动+固件（/usr/local/Ascend/driver）。
#
# 注意：CPU 侧应指向产线服务 :8080（PADDLEOCRVL_ADDRESS=http://<npu-ip>:8080），
#       不是 VLM :8118（VLM 仅产线内部调用）。
# ============================================================
services:
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX:-latest-huawei-npu-offline}
    build:
      context: .
      dockerfile: pipeline.Dockerfile
      args:
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vl-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    privileged: true
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
      - ./config:/home/paddleocr/config:ro
    shm_size: 64g
    user: root
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
    # 昇腾 NPU 需显式 --device npu
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/config/pipeline_config_${VLM_BACKEND}.yaml --device npu"
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${VLM_BACKEND:-vllm}-server:${VLM_IMAGE_TAG_SUFFIX:-latest-huawei-npu-offline}
    build:
      context: .
      dockerfile: vlm.Dockerfile
      args:
        BACKEND: "${VLM_BACKEND:-vllm}"
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vlm-server
    restart: unless-stopped
    privileged: true
    # 设备映射：昇腾 NPU 通过特权模式 + 挂载驱动目录访问（驱动在 /usr/local/Ascend 下，非 /dev 设备节点）。
    #   - /usr/local/Ascend/driver：必须带（NPU 驱动主目录，含 .so 与设备访问入口）。
    #   - /usr/local/bin/npu-smi、/usr/local/dcmi：必须带（管理工具 + DCMI 库）。
    #   - 选第几张卡：靠环境变量 ASCEND_RT_VISIBLE_DEVICES=N（0 起）在 CANN 层选卡；
    #     不设则默认用所有卡。多卡时在 environment: 加 ASCEND_RT_VISIBLE_DEVICES: "0" 指定单卡。
    #   - 查看宿主机实际 NPU：npu-smi info（列卡数/状态）；ls /usr/local/Ascend/driver（确认驱动已装）。
    #   - privileged：必须（NPU 驱动访问需特权）。
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
      - ./config/vllm_config.yaml:/home/paddleocr/vllm_config.yaml:ro
    shm_size: 64g
    user: root
    command: >
      paddleocr genai_server
      --model_name ${VLM_MODEL_NAME:-PaddleOCR-VL-1.6-0.9B}
      --host 0.0.0.0
      --port 8118
      --backend ${VLM_BACKEND:-vllm}
      --backend_config /home/paddleocr/vllm_config.yaml
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8118/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

networks:
  ocr-net:
    driver: bridge
    name: ocr-net
