# ============================================================
# PaddleOCR-VL × Intel GPU (amd64) — 官方产线 + VLM 双容器
# ------------------------------------------------------------
# 基于官方 PaddleOCR accelerators/intel-gpu 镜像；设备 /dev:/dev，无需 --device flag。
#
# 用法：
#   docker compose -f docker/paddleocr-intel-amd64/compose.yml up -d
#   CPU + GPU 同机：docker compose -f docker/docker-compose.yml -f docker/paddleocr-intel-amd64/compose.yml up -d
# 跨机：CPU 机设 PADDLEOCRVL_ADDRESS=http://<gpu-ip>:8080 后起 docker/docker-compose.yml
# 前置：宿主机已安装 Intel GPU 驱动（oneAPI / compute-runtime）。
# ============================================================
services:
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX:-latest-intel-gpu-offline}
    build:
      context: .
      dockerfile: pipeline.Dockerfile
      args:
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vl-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    devices:
      - /dev:/dev
    shm_size: 64g
    user: root
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
    volumes:
      - ./config:/home/paddleocr/config:ro
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/config/pipeline_config_${VLM_BACKEND}.yaml"
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${VLM_BACKEND:-vllm}-server:${VLM_IMAGE_TAG_SUFFIX:-latest-intel-gpu-offline}
    build:
      context: .
      dockerfile: vlm.Dockerfile
      args:
        BACKEND: "${VLM_BACKEND:-vllm}"
        PADDLEOCR_VERSION: "${PADDLEOCR_VERSION:->=3.4.0,<3.5}"
        PADDLEX_VERSION: "${PADDLEX_VERSION:->=3.4.0,<3.5}"
        BUILD_FOR_OFFLINE: "${BUILD_FOR_OFFLINE:-false}"
    container_name: paddleocr-vlm-server
    restart: unless-stopped
    # 设备映射：Intel GPU 通过 /dev/dri（renderD12N 渲染节点）+ /dev/dri/cardN 访问，故整挂 /dev:/dev 最省事。
    #   - /dev:/dev：必须带（Intel compute-runtime 设备在 /dev/dri 下；整目录挂载含所有卡，不在此处选卡）。
    #   - 选第几张卡：设备节点不区分卡 id，靠环境变量 ZE_AFFINITY_MASK=N（0 起）在 oneAPI 层选卡；
    #     不设则默认用所有卡。多卡时在 environment: 加 ZE_AFFINITY_MASK: "0" 指定单卡。
    #   - 查看宿主机实际设备节点：ls /dev/dri/（看 cardN/renderD12N）或 intel_gpu_top / sycl-ls（确认卡数与状态）。
    devices:
      - /dev:/dev
    shm_size: 64g
    user: root
    # 挂载 vllm_config（vllm 后端 served-model-name 等；与远程手搭版对齐）
    volumes:
      - ./config/vllm_config.yaml:/home/paddleocr/vllm_config.yaml:ro
    command: >
      paddleocr genai_server
      --model_name ${VLM_MODEL_NAME:-PaddleOCR-VL-1.6-0.9B}
      --host 0.0.0.0
      --port 8118
      --backend ${VLM_BACKEND:-vllm}
      --backend_config /home/paddleocr/vllm_config.yaml
    networks:
      - ocr-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8118/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

networks:
  ocr-net:
    driver: bridge
    name: ocr-net
